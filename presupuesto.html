<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presupuesto | NYVO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="index.html">
      <img src="img/logo/LOGO sin fondo.png" alt="Logo de NYVO">
    </a>

    <nav aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a class="activo" aria-current="page" href="presupuesto.html">Presupuesto</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </header>

  <main>
    <section>
      <h1>Solicita tu presupuesto</h1>
      <p class="intro-formulario">
        Rellena el formulario y nos pondremos en contacto contigo.
      </p>

      <form action="#" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono"
               pattern="[0-9 +()-]{9,}" required
               title="Introduce un teléfono válido con al menos 9 caracteres.">

        <label for="informacion">Solicite más información:</label>
        <textarea id="informacion" name="informacion" rows="5" required></textarea>

        <label class="privacidad">
          <input type="checkbox" name="privacidad" required>
          <span>Acepto la <a href="aviso-legal.html">Política de privacidad</a></span>
        </label>

        <button type="submit">Enviar solicitud</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Dirección: C/ Gran Vía de Don Diego López de Haro, 7-9, Bilbao</p>

    <div class="redes-sociales">
        <a href="https://www.instagram.com/nyvocards/" target="_blank"
            rel="noopener noreferrer" aria-label="Instagram de NYVO">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="18" cy="6" r="1"></circle>
        </svg>
      </a>
      <a href="https://www.facebook.com/" target="_blank"
         rel="noopener noreferrer" aria-label="Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5h1.7V3.9c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3V10H7.3v3h2.8v8z"></path>
        </svg>
      </a>
    </div>

    <p><a href="aviso-legal.html">Aviso legal y política de privacidad</a></p>
  </footer>
</body>
</html>
